# Bot behaviour. Deployment settings (token, backend, model, limits) live in .env.
default_persona: mochi
allowed_channels:
  - sim-city
  - little-st-james
  - shitpost
  - games
  - leg-day
# Channels where only tarot works: /tarot, "draw a card" in chat, right-click a message → Draw a tarot card.
tarot_channels:
  - lizzie’s-reflecting-pool
# The Outside: AQ, Tic-Xenotation, Pandemonium and the Land/Deleuze quote bank, with nothing else of the bot.
outside_channels:
  - nanospasm
# Mini Me adds a line of her own under each tarot reading: one model call per reading (wakes the GPU when it's
# cold). Admins can switch it with /bot tarot.
tarot_mini_me: false
# A few unprompted persona drops a day (drop-ins on live chat, openers when quiet), in a UTC window.
heartbeat_channels:
  - shitpost
  - leg-day
heartbeat_per_day: 3
heartbeat_hours: "13-1"
# The Monday digest of the week, posted at 09:00 UTC by the minutes persona.
digest_channel: newsroom
# Now and then the channel's persona reacts to a message it wasn't sent with a fitting server emote (emotes.json):
# one per channel per cooldown. /status turns it off per channel.
ambient_reactions: true
ambient_cooldown_minutes: 20
